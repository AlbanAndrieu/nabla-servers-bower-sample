---
name: scan with KICS and upload SARIF

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  kics-job:
    runs-on: ubuntu-26.04
    name: kics-action
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Mkdir results-dir
        run: mkdir -p results-dir

      # only what the project ships
      - name: Run KICS Scan with SARIF result
        uses: checkmarx/kics-github-action@v2.1.19
        with:
          path: src,ansible,k8s,packs,Dockerfile
          fail_on: high,medium
          output_path: results-dir
          output_formats: json,sarif
          # seek query id in it's metadata.json
          exclude_queries: 0437633b-daa6-4bbc-8526-c0d2443b946e

      - name: Upload SARIF file
        if: success() || failure()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results-dir/results.sarif
