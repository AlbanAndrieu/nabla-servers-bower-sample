---
# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  push:
    branches: [master, main]
    paths-ignore:
      - "**.md"
  schedule:
    - cron: 0 6 * * 3
  pull_request:
    branches: [master, main]
    types: [opened, synchronize, reopened]
    paths-ignore:
      - "**.md"

env:
  REPO: ${{ github.event.repository.name }}
  OWNER: ${{ github.event.repository.owner.login }}
  ISSUE_NUMBER: ${{ github.event.issue.number }}
  HEAD_OWNER: ${{ github.event.pull_request.head.repo.owner.login }}

jobs:
  build-maven:
    # if: github.actor!= 'dependabot-preview[bot]'   # ignore the pull request which comes from user depbot.
    name: Build Maven
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # versions come from mise.toml, only java is needed for the Maven build
      - uses: jdx/mise-action@v5
        with:
          install_args: java

      - uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('pom.xml') }}
          restore-keys: maven-

      # frontend (npm/bower/grunt) is skipped: Gruntfile no longer loads on current Node
      - name: Build with Maven
        run: ./mvnw -B package -Dmaven.exec.skip=true

  build-docker:
    if: github.actor != 'dependabot[bot]' && github.actor!= 'dependabot-preview[bot]'   # ignore the pull request which comes from user dependabot.
    name: Build Docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # https://github.com/docker/login-action
      # https://github.com/dependabot/dependabot-core/issues/3253
      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          logout: true

      - name: Login to Github Packages
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      #- name: Login to ECR
      #  uses: docker/login-action@v4
      #  with:
      #    registry: <aws-account-number>.dkr.ecr.<region>.amazonaws.com
      #    username: ${{ secrets.AWS_ACCESS_KEY_ID }}
      #    password: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      #- name: Extract metadata (tags, labels) for Docker
      #  id: meta
      #  uses: docker/metadata-action@98669ae865ea3cffbcbaa878cf57c20bbf1c6c38
      #  with:
      #    images: nabla/nabla-servers-bower-sample:latest

      - name: Build and push debug
        run: echo "docker push nabla/nabla-servers-bower-sample:latest,${{ github.repository }}:${{ github.sha }}"

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          #tags: nabla/nabla-servers-bower-sample:latest,nabla/nabla-servers-bower-sample:${{ github.sha }}
          tags: |
            nabla/nabla-servers-bower-sample:latest
          # load the image in the local daemon so Trivy scans this build, not the registry one
          load: true
          # build on feature branches, push only on main branch
          push: ${{ github.ref == 'refs/heads/main' }}

      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: nabla/nabla-servers-bower-sample:latest
          format: sarif
          output: "trivy-results.sarif"
          ignore-unfixed: true
          vuln-type: "os,library"
          timeout: "10m0s"
          scanners: vuln
          severity: "CRITICAL,HIGH"

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: "trivy-results.sarif"

