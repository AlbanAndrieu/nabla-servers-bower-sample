---
# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  push:
    branches: [master, main]
    paths-ignore:
      - '**.md'
  schedule:
    - cron: 0 6 * * 3
  pull_request:
    branches: [master, main]
    types: [opened, synchronize, reopened]
    paths-ignore:
      - '**.md'

permissions:
  contents: read

# a new push on a PR cancels its previous run, master runs always complete
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-chart:
    name: Lint Helm chart
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v4

      - name: Lint and render the chart
        run: |
          helm lint --strict packs/helm-sample/charts
          helm template ci packs/helm-sample/charts > /dev/null

  # MegaLinter's JAVASCRIPT linters are disabled, eslint.config.mjs is the reference
  lint-js:
    name: Lint JS
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: npm

      - name: Run eslint
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run eslint

  build-maven:
    # if: github.actor!= 'dependabot-preview[bot]'   # ignore the pull request which comes from user depbot.
    name: Build Maven
    runs-on: ubuntu-26.04
    outputs:
      use-nexus: ${{ steps.nexus.outputs.use-nexus }}
    steps:
      - uses: actions/checkout@v7

      # versions come from mise.toml, only java is needed for the Maven build
      - uses: jdx/mise-action@v5
        with:
          install_args: java

      - uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('pom.xml') }}
          restore-keys: maven-

      # Access answers a bad token with its HTML login page, which Maven would cache as artifacts.
      # A homelab outage (Cloudflare 52x, no answer) falls back to Maven Central instead of failing.
      - name: Check Nexus access
        id: nexus
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          [ -n "${CF_ACCESS_CLIENT_ID:-}" ] || exit 0
          status=$(curl -sS -o /dev/null -w '%{http_code} %{content_type}' --max-time 30 \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            https://nexus.albandrieu.com/repository/maven-public/kr/motd/maven/os-maven-plugin/1.7.0/os-maven-plugin-1.7.0.jar) || true
          echo "Nexus: $status"
          case "$status" in
            "200 application/java-archive") echo "use-nexus=true" >> "$GITHUB_OUTPUT" ;;
            000* | 5*) echo "::warning::Nexus unreachable ($status), resolving from Maven Central" ;;
            *) exit 1 ;;
          esac

      # the frontend (scripts/build-frontend.mjs) is built by the Dockerfile FRONTEND stage
      - name: Build with Maven
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          USE_NEXUS: ${{ steps.nexus.outputs.use-nexus }}
        run: |
          if [ "$USE_NEXUS" = true ]; then set -- -s settings.xml; fi
          ./mvnw -B package -Dmaven.exec.skip=true "$@"

  build-docker:
    if: github.actor != 'dependabot[bot]' && github.actor!= 'dependabot-preview[bot]' # ignore the pull request which comes from user dependabot.
    name: Build Docker
    needs: build-maven
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
      security-events: write
    env:
      IMAGE: ghcr.io/albanandrieu/nabla-servers-bower-sample
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # https://github.com/docker/login-action
      # https://github.com/dependabot/dependabot-core/issues/3253
      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          logout: true

      - name: Login to Github Packages
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ github.ref == 'refs/heads/master' && format('{0}:latest', env.IMAGE) || '' }}
          # Maven resolves through nexus.albandrieu.com (Cloudflare Access service token) when the build-maven check reached it
          secrets: |
            cf_access_client_id=${{ needs.build-maven.outputs.use-nexus == 'true' && secrets.CF_ACCESS_CLIENT_ID || '' }}
            cf_access_client_secret=${{ needs.build-maven.outputs.use-nexus == 'true' && secrets.CF_ACCESS_CLIENT_SECRET || '' }}
          # load the image in the local daemon so Trivy scans this build, not the registry one
          load: true
          # every non-fork build goes to ghcr.io (GITHUB_TOKEN, no long-lived secret); latest only on master
          push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}

      # deploy the image like the runtime would, probe the REST endpoint and the frontend assets
      - name: Smoke test
        run: |
          docker run -d --name bower-sample -p 8080:8080 "$IMAGE:sha-$GITHUB_SHA"
          for _ in $(seq 30); do
            curl -fsS http://localhost:8080/rest/books/test && break
            sleep 5
          done
          for path in / /rest/books/test /rest/books /vendor/bootstrap/dist/js/bootstrap.bundle.min.js /styles/main.css /scripts/app.js /views/main.html; do
            curl -fsS -o /dev/null "http://localhost:8080$path" || { docker logs bower-sample; exit 1; }
          done
          # only GET and HEAD are allowed by web.xml
          [ "$(curl -s -o /dev/null -w '%{http_code}' -X PUT http://localhost:8080/admin/x)" = 403 ]

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:sha-${{ github.sha }}
          format: sarif
          output: 'trivy-results.sarif'
          ignore-unfixed: true
          vuln-type: 'os,library'
          timeout: '10m0s'
          scanners: vuln
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'
