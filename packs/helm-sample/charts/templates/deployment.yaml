apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "testChart.fullname" . }}
  namespace: {{ .Release.Namespace }}
  # See https://helm.sh/docs/chart_best_practices/labels/
  labels:
    environment: dev
    app.kubernetes.io/component: sample
    app.kubernetes.io/part-of: test
    app: "{{ template "testChart.name" . }}"
    chart: "{{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}"
    heritage: "{{ .Release.Service  }}"
    release: "{{ .Release.Name }}"
    {{- include "testChart.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "testChart.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "testChart.selectorLabels" . | nindent 8 }}
        app: {{ template "testChart.name" . }}
        chart: {{ template "testChart.chart" . }}
        tier: frontend
        track: canary
    spec:
    {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
    {{- end }}
      serviceAccountName: {{ include "testChart.serviceAccountName" . }}
      # the app never calls the Kubernetes API
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        - name: sleep
          image: busybox:1.37
          imagePullPolicy: Always
          command:
            - sh
            - -c
            - 'echo "create by init-container" > /secrets/file'
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            limits:
              cpu: 50m
              memory: 16Mi
            requests:
              cpu: 10m
              memory: 16Mi
          volumeMounts:
            - mountPath: /secrets
              name: shared
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
          - name: TITLE
            value: "Welcome to (AKS)"
          image: "{{ .Values.global.registry }}{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          # the image entrypoint starts Jetty 12 from /var/lib/jetty (JETTY_BASE)
          #imagePullPolicy: {{ .Values.image.imagePullPolicy }}
          terminationMessagePath: "/tmp/my-log"
          ports:
            - name: http
              #containerPort: 80
              containerPort: 8080
              protocol: TCP
          # See https://kubernetes.io/fr/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
          readinessProbe:
            httpGet:
              path: /rest/books/test
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12 # ~2 minutes
          livenessProbe:
            httpGet:
              path: /rest/books/test
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - mountPath: /secrets
              name: shared
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
    {{- end }}
      volumes:
        - name: shared
          #emptyDir: {}
          emptyDir:
            medium: Memory
